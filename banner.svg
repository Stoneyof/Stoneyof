<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0a1a"/>
      <stop offset="50%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#2a1458"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <ellipse cx="450" cy="110" rx="330" ry="90" fill="url(#orb)"/>

  <!-- grade sutil -->
  <g stroke="#a78bfa" stroke-opacity="0.08">
    <path d="M0 55H900M0 110H900M0 165H900"/>
    <path d="M150 0V220M300 0V220M450 0V220M600 0V220M750 0V220"/>
  </g>

  <!-- cantos -->
  <g stroke="#a78bfa" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M24 56V24H56"/>
    <path d="M844 24H876V56"/>
    <path d="M24 164V196H56"/>
    <path d="M844 196H876V164"/>
  </g>

  <!-- partículas -->
  <g fill="#c4b5fd">
    <circle cx="90" cy="150" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="60" r="2.5" opacity="0.7">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="170" r="1.8" fill="#e879f9">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="50" r="1.8" fill="#e879f9">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nome -->
  <text x="450" y="115" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="56" font-weight="bold" fill="url(#title)" filter="url(#glow)">SEU NOME</text>

  <!-- subtítulo -->
  <text x="450" y="152" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="18" letter-spacing="6" fill="#a78bfa">&gt; desenvolvedor_</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
